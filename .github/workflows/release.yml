# Publishes a release in one of two ways:
#   1. pushing a tag:  git tag v0.3.0 && git push origin v0.3.0
#   2. by hand: Actions tab > release > "Run workflow", giving the version (creates the tag)
# Builds natively on Windows and Linux, runs the tests and attaches the packages.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Version (e.g. v0.3.0)"
        required: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            pacote: sonic-tools-windows.zip
            ext: .exe
          - os: ubuntu-24.04
            pacote: sonic-tools-linux.tar.gz
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.0" }
      - name: build and test
        working-directory: engine
        shell: bash
        run: |
          cargo test --release --locked
          cargo build --release --locked -p sonic-mod -p sonic-dump
      - name: package
        shell: bash
        run: |
          mkdir -p sonic-tools
          cp engine/target/release/sonic-mod${{ matrix.ext }} engine/target/release/sonic-dump${{ matrix.ext }} sonic-tools/
          cp docs/MODDING.md sonic-tools/MODDING-GUIDE.md
          cp docs/LEIA-ME-BINARIOS.txt sonic-tools/README.txt
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a ${{ matrix.pacote }} sonic-tools; else tar czf ${{ matrix.pacote }} sonic-tools; fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.pacote }}
          path: ${{ matrix.pacote }}
  publicar:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.versao || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.versao || github.ref_name }}
          files: |
            sonic-tools-windows.zip
            sonic-tools-linux.tar.gz
          body: |
            Sonic Chronicles (DS) tools: **sonic-mod** (spreadsheet-based modding) and **sonic-dump** (asset extraction).
            Built and tested by GitHub Actions from version `${{ inputs.versao || github.ref_name }}`.
            Guide: https://github.com/${{ github.repository }}/blob/main/docs/MODDING.md
            Use with a copy of the game you own. No game data is included.
